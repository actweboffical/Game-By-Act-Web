<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centipede Reptile Game</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#101418;
    font-family:Arial,sans-serif;
}



canvas{
    display:block;
}

#score{
    position:fixed;
    top:10px;
    left:10px;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    z-index:10;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const mouse={
    x:canvas.width/2,
    y:canvas.height/2
};

window.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

let score=0;

const reptile={
    segments:[],
    segmentDistance:16,
    speed:0.08
};

let segmentCount=24;

for(let i=0;i<segmentCount;i++){
    reptile.segments.push({
        x:canvas.width/2,
        y:canvas.height/2
    });
}

function spawnFood(){
    return{
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:8
    };
}

const foods=[];
for(let i=0;i<8;i++) foods.push(spawnFood());

function drawFood(food){
    ctx.beginPath();
    ctx.fillStyle="#ff5b5b";
    ctx.arc(food.x,food.y,food.r,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle="#7cff7c";
    ctx.arc(food.x,food.y,3,0,Math.PI*2);
    ctx.fill();
}

function grow(){
    reptile.segments.push({
        x:reptile.segments[reptile.segments.length-1].x,
        y:reptile.segments[reptile.segments.length-1].y
    });
}

function drawLeg(x,y,angle,length){
    const kneeX=x+Math.cos(angle)*length;
    const kneeY=y+Math.sin(angle)*length;

    const footX=kneeX+Math.cos(angle)*length*0.5;
    const footY=kneeY+Math.sin(angle)*length*0.5;

    ctx.strokeStyle="#82ff82";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(kneeX,kneeY);
    ctx.lineTo(footX,footY);
    ctx.stroke();
}

let tick=0;

function update(){

    tick+=0.06;

    const head=reptile.segments[0];

    head.x+=(mouse.x-head.x)*reptile.speed;
    head.y+=(mouse.y-head.y)*reptile.speed;

    for(let i=1;i<reptile.segments.length;i++){

        const prev=reptile.segments[i-1];
        const seg=reptile.segments[i];

        const dx=prev.x-seg.x;
        const dy=prev.y-seg.y;

        const angle=Math.atan2(dy,dx);

        seg.x=prev.x-Math.cos(angle)*reptile.segmentDistance;
        seg.y=prev.y-Math.sin(angle)*reptile.segmentDistance;
    }

    for(let i=foods.length-1;i>=0;i--){

        const dx=foods[i].x-head.x;
        const dy=foods[i].y-head.y;

        if(Math.hypot(dx,dy)<20){

            foods.splice(i,1);
            foods.push(spawnFood());

            score++;
            document.getElementById("score").textContent=
                "Score: "+score;

            grow();
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    foods.forEach(drawFood);

    for(let i=4;i<reptile.segments.length-2;i+=2){

        const seg=reptile.segments[i];
        const prev=reptile.segments[i-1];

        const ang=Math.atan2(
            prev.y-seg.y,
            prev.x-seg.x
        );

        const walk=Math.sin(tick+i)*0.8;

        drawLeg(
            seg.x,
            seg.y,
            ang+Math.PI/2+walk,
            10
        );

        drawLeg(
            seg.x,
            seg.y,
            ang-Math.PI/2-walk,
            10
        );
    }

    for(let i=reptile.segments.length-1;i>=0;i--){

        const seg=reptile.segments[i];

        const size=Math.max(
            5,
            18-(i*0.35)
        );

        const green=180-(i*2);

        ctx.fillStyle=
        `rgb(40,${green},60)`;

        ctx.beginPath();
        ctx.arc(
            seg.x,
            seg.y,
            size,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

    const head=reptile.segments[0];
    const neck=reptile.segments[1];

    const angle=Math.atan2(
        head.y-neck.y,
        head.x-neck.x
    );

    const eyeOffset=8;

    const lx=head.x+
    Math.cos(angle-Math.PI/2)*eyeOffset;

    const ly=head.y+
    Math.sin(angle-Math.PI/2)*eyeOffset;

    const rx=head.x+
    Math.cos(angle+Math.PI/2)*eyeOffset;

    const ry=head.y+
    Math.sin(angle+Math.PI/2)*eyeOffset;

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(lx,ly,4,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(rx,ry,4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";

    ctx.beginPath();
    ctx.arc(
        lx+Math.cos(angle)*2,
        ly+Math.sin(angle)*2,
        2,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        rx+Math.cos(angle)*2,
        ry+Math.sin(angle)*2,
        2,
        0,
        Math.PI*2
    );
    ctx.fill();

    const tail=
    reptile.segments[
        reptile.segments.length-1
    ];

    ctx.beginPath();
    ctx.fillStyle="#2a5";
    ctx.arc(
        tail.x+
        Math.sin(tick)*3,
        tail.y,
        4,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
